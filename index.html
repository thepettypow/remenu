<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Osteria Bella — Digital Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="screen" id="screen">

  <header class="site-header">
    <h1 class="site-title">Osteria Bella</h1>
    <p class="site-subtitle">Neapolitan kitchen &amp; wine bar</p>
  </header>

  <nav class="category-nav" id="categoryNav" aria-label="Menu categories"></nav>

  <main id="menuRoot"></main>

</div>

<!-- Scrim -->
<div class="sheet-scrim" id="sheetScrim"></div>

<!-- BOTTOM SHEET: Food Details View (content populated per-dish by script.js) -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-drag" aria-hidden="true"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Close details">✕</button>

  <div class="sheet-scroll">
    <div class="sheet-photo" id="sheetPhoto"></div>

    <div class="sheet-content">
      <h1 class="sheet-title" id="sheetTitle"></h1>

      <div class="tag-row" id="sheetTags"></div>

      <div class="prep-time" id="sheetPrepTime"></div>

      <p class="sheet-desc" id="sheetDesc"></p>

      <hr class="divider">

      <!-- Portion toggle (hidden entirely for single-portion dishes) -->
      <section class="section" id="portionSection">
        <div class="portion-toggle" id="portionToggle" role="tablist" aria-label="Portion size"></div>
      </section>

      <hr class="divider" id="portionDivider">

      <!-- Ingredients -->
      <section class="section">
        <h2 class="section-label">Ingredients</h2>
        <div class="chip-row" id="sheetIngredients"></div>
      </section>

      <hr class="divider">

      <!-- Nutrition -->
      <section class="section nutrition">
        <h2 class="section-label">Nutrition Facts — per <span id="servingSize"></span>g serving</h2>

        <div class="calories-row">
          <span class="calories-value" id="calValue"></span>
          <span class="calories-unit">kcal</span>
        </div>

        <div class="macro-row">
          <div class="macro">
            <span class="macro-value" id="macroProtein"></span>
            <span class="macro-label">Protein</span>
          </div>
          <div class="macro">
            <span class="macro-value" id="macroCarbs"></span>
            <span class="macro-label">Total Carbs</span>
          </div>
          <div class="macro">
            <span class="macro-value" id="macroFat"></span>
            <span class="macro-label">Total Fat</span>
          </div>
        </div>

        <button class="disclosure-toggle" id="microToggle" aria-expanded="false" aria-controls="microDetails">
          <span>Show more nutrition details</span>
          <span class="disclosure-chevron">⌄</span>
        </button>

        <div class="micro-details" id="microDetails">
          <div class="micro-row">
            <span class="micro-label">Dietary Fiber</span>
            <span class="micro-value" id="microFiber"></span>
          </div>
          <div class="micro-row">
            <span class="micro-label">Sugars</span>
            <span class="micro-value" id="microSugars"></span>
          </div>
          <div class="micro-row">
            <span class="micro-label">Sodium</span>
            <span class="micro-value" id="microSodium"></span>
          </div>
        </div>
      </section>

      <div class="sheet-bottom-pad"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
